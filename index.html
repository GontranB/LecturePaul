<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('fallback-error');
    if (!el) return;
    var msg;
    if (e.target && e.target !== window && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      msg = 'Échec de chargement d\'une ressource : ' + (e.target.src || e.target.href);
    } else {
      msg = (e.message || 'Erreur inconnue') + '  [' + (e.filename || '?') + ':' + (e.lineno || '?') + ']';
    }
    el.style.display = 'block';
    el.textContent += msg + '\n\n';
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var el = document.getElementById('fallback-error');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += 'Promesse rejetée : ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '\n\n';
  });
</script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Design tokens ----------
const COLORS = {
  paper: '#FFFFFF', paperDark: '#E6E6E6', card: '#F1F1F1',
  ink: '#111111', inkSoft: '#6E6E6E', oxblood: '#5B8DBE',
  forest: '#111111', gold: '#5B8DBE', slate: '#5B8DBE',
  gray: '#A3A3A3', line: '#E0E0E0', accent: '#5B8DBE',
};

const STATUS_OPTIONS = [
  { id: 'a_acheter', label: 'À acheter', color: COLORS.gray },
  { id: 'a_lire', label: 'À lire', color: COLORS.inkSoft },
  { id: 'en_cours', label: 'En cours de lecture', color: COLORS.accent },
  { id: 'lu', label: 'Lu', color: COLORS.ink },
  { id: 'abandonne', label: 'Abandonné', color: '#C2C2C2' },
];

const DEFAULT_CATEGORIES = ['Policier', 'Étranger', 'Roman graphique'];
const STORAGE_KEY = 'biblio-data';
const AIRTABLE_BASE_ID = 'appQtaT8cHEAQuaTp';
const AIRTABLE_TABLE_ID = 'tblNKjCq0nrvoolQi';

function statusInfo(id) { return STATUS_OPTIONS.find((s) => s.id === id) || STATUS_OPTIONS[1]; }
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function normalize(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function emptyBook() {
  return { id: null, title: '', author: '', pageCount: '', isbn: '', status: 'a_lire', rating: 0, categories: [], cover: null, startDate: '', endDate: '', pagesRead: '', comment: '' };
}
function progressPercent(book) {
  if (book.status === 'lu') return 100;
  const total = parseInt(book.pageCount, 10);
  const read = parseInt(book.pagesRead, 10);
  if (!total || !read) return null;
  return Math.max(0, Math.min(100, Math.round((read / total) * 100)));
}

// ---------- Icons (self-contained SVGs, no external icon library) ----------
const STAR_POINTS = "12,2 14.35,8.76 21.51,8.91 15.80,13.24 17.88,20.09 12,16 6.12,20.09 8.20,13.24 2.49,8.91 9.65,8.76";
function StarShape({ size = 20, color = '#000', fill = false }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} style={{ display: 'block' }}>
      <polygon points={STAR_POINTS} fill={fill ? color : 'none'} stroke={color} strokeWidth="1.6" strokeLinejoin="round" />
    </svg>
  );
}
const Icon = {
  Search: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><circle cx="10" cy="10" r="6" /><line x1="20" y1="20" x2="14.5" y2="14.5" /></svg>
  ),
  Plus: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
  ),
  X: ({ size = 14, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="5" y1="5" x2="19" y2="19" /><line x1="19" y1="5" x2="5" y2="19" /></svg>
  ),
  Filter: ({ size = 14, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="4,4 20,4 14,13 14,19 10,19 10,13" /></svg>
  ),
  ChevronLeft: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15,4 7,12 15,20" /></svg>
  ),
  ChevronDown: ({ size = 16, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4,8 12,16 20,8" /></svg>
  ),
  Trash: ({ size = 15, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="7" x2="20" y2="7" /><path d="M6 7 L7 21 H17 L18 7" /><path d="M9 7 V4 H15 V7" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
  ),
  BookOpen: ({ size = 24, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 5 C6 3 10 3 12 5 C14 3 18 3 22 5 V19 C18 17 14 17 12 19 C10 17 6 17 2 19 Z" /><line x1="12" y1="5" x2="12" y2="19" /></svg>
  ),
  Check: ({ size = 15, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="4,13 9,18 20,6" /></svg>
  ),
  Alert: ({ size = 16, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="13" /><circle cx="12" cy="16.3" r="0.6" fill={color} stroke="none" /></svg>
  ),
  Camera: ({ size = 16, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8 H7 L9 5 H15 L17 8 H20 A1 1 0 0 1 21 9 V18 A1 1 0 0 1 20 19 H4 A1 1 0 0 1 3 18 V9 A1 1 0 0 1 4 8 Z" /><circle cx="12" cy="13.5" r="3.5" /></svg>
  ),
  Loader: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" className="animate-spin"><path d="M12 3 A9 9 0 0 1 21 12" /></svg>
  ),
};

// ---------- Star rating (1-5, half-star steps) ----------
function StarRating({ value, onChange, readOnly, size = 22 }) {
  const handleClick = (e, starIndex) => {
    if (readOnly) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const isHalf = clickX < rect.width / 2;
    const newValue = isHalf ? starIndex - 0.5 : starIndex;
    onChange(value === newValue ? 0 : newValue);
  };
  return (
    <div className="flex items-center gap-2">
      <div className="flex gap-0.5">
        {[1, 2, 3, 4, 5].map((i) => {
          const fillPct = Math.max(0, Math.min(1, value - (i - 1))) * 100;
          return (
            <div key={i} onClick={(e) => handleClick(e, i)} className={readOnly ? '' : 'cursor-pointer'} style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
              <StarShape size={size} color={COLORS.line} fill={false} />
              <div style={{ position: 'absolute', top: 0, left: 0, width: `${fillPct}%`, overflow: 'hidden' }}>
                <StarShape size={size} color={COLORS.gold} fill={true} />
              </div>
            </div>
          );
        })}
      </div>
      {!readOnly && value > 0 && (
        <button onClick={() => onChange(0)} className="text-xs underline" style={{ color: COLORS.inkSoft }}>effacer</button>
      )}
      {!readOnly && (
        <span className="text-sm tabular-nums" style={{ color: COLORS.inkSoft }}>{value > 0 ? value.toFixed(1) : '—'}</span>
      )}
    </div>
  );
}

// ---------- Cover thumbnail with fallback ----------
function Cover({ src, size = 56 }) {
  const [failed, setFailed] = useState(false);
  return (
    <div className="flex items-center justify-center rounded overflow-hidden flex-shrink-0" style={{ width: size, height: size * 1.4, backgroundColor: COLORS.paperDark }}>
      {src && !failed ? (
        <img src={src} alt="" onError={() => setFailed(true)} className="w-full h-full object-cover" />
      ) : (
        <Icon.BookOpen size={size * 0.4} color={COLORS.gray} />
      )}
    </div>
  );
}

// ---------- Pill button ----------
function Pill({ active, color, onClick, children }) {
  const c = color || COLORS.ink;
  return (
    <button onClick={onClick} className="px-3 py-1.5 rounded-full text-sm border whitespace-nowrap transition-colors"
      style={active ? { backgroundColor: c, borderColor: c, color: COLORS.card } : { backgroundColor: hexToRgba(c, 0.08), borderColor: hexToRgba(c, 0.35), color: c }}>
      {children}
    </button>
  );
}

function StatCard({ label, value, sub }) {
  return (
    <div className="p-4 rounded-2xl" style={{ backgroundColor: '#FFFFFF', boxShadow: '0 1px 3px rgba(0,0,0,0.06)' }}>
      <div className="text-xs uppercase tracking-wide font-medium" style={{ color: COLORS.inkSoft }}>{label}</div>
      <div className="font-serif text-3xl mt-1" style={{ color: COLORS.ink }}>{value}</div>
      {sub && <div className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>{sub}</div>}
    </div>
  );
}

function BarRow({ label, value, max, color, suffix, onClick, active, dimmed }) {
  const pct = max > 0 ? Math.max(2, (value / max) * 100) : 0;
  const Wrapper = onClick ? 'button' : 'div';
  return (
    <Wrapper onClick={onClick} className="flex items-center gap-2 w-full text-left" style={{ opacity: dimmed ? 0.4 : 1, transition: 'opacity 0.15s' }}>
      <div className="text-xs w-24 truncate flex-shrink-0" style={{ color: active ? COLORS.ink : COLORS.inkSoft, fontWeight: active ? 700 : 400 }} title={label}>{label}</div>
      <div className="flex-1 rounded-full overflow-hidden" style={{ height: 10, backgroundColor: COLORS.paperDark }}>
        <div style={{ height: 10, width: `${pct}%`, backgroundColor: color || COLORS.accent, borderRadius: 9999 }} />
      </div>
      <div className="text-xs w-8 text-right flex-shrink-0 tabular-nums" style={{ color: COLORS.ink }}>{value}{suffix || ''}</div>
    </Wrapper>
  );
}

function App() {
  const [books, setBooks] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState('');
  const [syncing, setSyncing] = useState(false);

  const [view, setView] = useState('list');
  const [form, setForm] = useState(emptyBook());
  const [newCategoryInput, setNewCategoryInput] = useState('');

  const [searchQuery, setSearchQuery] = useState('');
  const [showFilters, setShowFilters] = useState(false);
  const [statusFilter, setStatusFilter] = useState('tous');
  const [categoryFilter, setCategoryFilter] = useState([]);
  const [ratingFilter, setRatingFilter] = useState(0);
  const [yearFilter, setYearFilter] = useState([]);

  const [showImport, setShowImport] = useState(false);
  const [importMode, setImportMode] = useState('titre');
  const [importQuery, setImportQuery] = useState('');
  const [importResults, setImportResults] = useState([]);
  const [importLoading, setImportLoading] = useState(false);
  const [importError, setImportError] = useState('');
  const [importedNote, setImportedNote] = useState(false);

  const [apiKey, setApiKey] = useState('');
  const [apiKeyInput, setApiKeyInput] = useState('');
  const [showApiKeyField, setShowApiKeyField] = useState(false);

  const [airtableToken, setAirtableToken] = useState('');
  const [airtableTokenInput, setAirtableTokenInput] = useState('');
  const [showAirtableField, setShowAirtableField] = useState(false);

  const [showScanner, setShowScanner] = useState(false);
  const [scannerStatus, setScannerStatus] = useState('');
  const [scannerError, setScannerError] = useState('');
  const [scannerTarget, setScannerTarget] = useState('manual'); // 'manual' = champ ISBN du formulaire | 'import' = recherche
  const codeReaderRef = useRef(null);

  // ---------- Load / persist (localStorage — this file runs outside the Claude sandbox) ----------
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed.apiKey) { setApiKey(parsed.apiKey); setApiKeyInput(parsed.apiKey); }
        if (parsed.airtableToken) { setAirtableToken(parsed.airtableToken); setAirtableTokenInput(parsed.airtableToken); }
      }
    } catch (e) { /* première utilisation, ou stockage illisible : on part des valeurs par défaut */ }
    setLoading(false);
  }, []);

  const persistSettings = (newApiKey, newAirtableToken) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        apiKey: newApiKey !== undefined ? newApiKey : apiKey,
        airtableToken: newAirtableToken !== undefined ? newAirtableToken : airtableToken,
      }));
    } catch (e) { /* réglages non critiques : on ignore une éventuelle erreur de stockage */ }
  };

  const saveApiKey = () => {
    const key = apiKeyInput.trim();
    setApiKey(key);
    persistSettings(key, undefined);
    setShowApiKeyField(false);
  };
  const saveAirtableToken = () => {
    const token = airtableTokenInput.trim();
    setAirtableToken(token);
    persistSettings(undefined, token);
    setShowAirtableField(false);
  };

  // ---------- Airtable (base de données distante) ----------
  const airtableFetch = async (path, options) => {
    const res = await fetch(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_ID}${path || ''}`, {
      ...(options || {}),
      headers: { 'Authorization': `Bearer ${airtableToken}`, 'Content-Type': 'application/json', ...((options && options.headers) || {}) },
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).error?.message || ''; } catch (e) {}
      throw new Error(`HTTP ${res.status}` + (detail ? ` — ${detail}` : ''));
    }
    return res.json();
  };

  const recordToBook = (rec) => {
    const f = rec.fields || {};
    const statusMatch = STATUS_OPTIONS.find((s) => s.label === f['Statut']);
    return {
      id: rec.id,
      title: f['Titre'] || '',
      author: f['Auteur'] || '',
      pageCount: f['Pages'] || '',
      isbn: (f['ISBN'] && f['ISBN'].text) || '',
      status: statusMatch ? statusMatch.id : 'a_lire',
      rating: f['Note'] || 0,
      categories: f['Categories'] || [],
      cover: (f['Couverture'] && f['Couverture'][0] && f['Couverture'][0].url) || null,
      startDate: f['DebutLecture'] || '',
      endDate: f['FinLecture'] || '',
      pagesRead: f['PagesLues'] || '',
      comment: f['Commentaire'] || '',
    };
  };

  const bookToFields = (book) => {
    const st = statusInfo(book.status);
    return {
      'Titre': book.title || '',
      'Auteur': book.author || '',
      'Pages': book.pageCount ? parseInt(book.pageCount, 10) : null,
      'ISBN': book.isbn ? { text: String(book.isbn) } : null,
      'Statut': st.label,
      'Note': book.rating || null,
      'Categories': book.categories && book.categories.length ? book.categories : [],
      'Couverture': book.cover ? [{ url: book.cover }] : [],
      'DebutLecture': book.startDate || null,
      'FinLecture': book.endDate || null,
      'PagesLues': book.pagesRead ? parseInt(book.pagesRead, 10) : null,
      'Commentaire': book.comment || null,
    };
  };

  const refreshBooks = async () => {
    let all = []; let offset;
    do {
      const qs = offset ? `?pageSize=100&offset=${encodeURIComponent(offset)}` : '?pageSize=100';
      const data = await airtableFetch(qs);
      all = all.concat(data.records);
      offset = data.offset;
    } while (offset);
    const newBooks = all.map(recordToBook);
    setBooks(newBooks);
    const allCats = new Set(DEFAULT_CATEGORIES);
    newBooks.forEach((b) => (b.categories || []).forEach((c) => allCats.add(c)));
    setCategories(Array.from(allCats));
    return newBooks;
  };

  useEffect(() => {
    if (!airtableToken) return;
    setSyncing(true); setSaveError('');
    refreshBooks().catch((e) => setSaveError('Échec du chargement depuis Airtable : ' + (e && e.message ? e.message : String(e)))).finally(() => setSyncing(false));
  }, [airtableToken]);

  const deleteAllBooks = async () => {
    if (books.length === 0) { alert('Ta bibliothèque est déjà vide.'); return; }
    const ok = window.confirm(
      `Supprimer DÉFINITIVEMENT les ${books.length} livre${books.length !== 1 ? 's' : ''} de ta bibliothèque Airtable ?\n\n` +
      `Cette action est IRRÉVERSIBLE — il n'y a aucun moyen de revenir en arrière.\n\n` +
      `Astuce : utilise « Exporter (CSV) » avant si tu n'es pas certain.\n\n` +
      `Confirmer la suppression complète ?`
    );
    if (!ok) return;
    setSyncing(true); setSaveError('');
    try {
      const ids = books.map((b) => b.id);
      for (let i = 0; i < ids.length; i += 10) {
        const chunk = ids.slice(i, i + 10);
        const qs = chunk.map((id) => `records[]=${encodeURIComponent(id)}`).join('&');
        await airtableFetch(`?${qs}`, { method: 'DELETE' });
      }
      await refreshBooks();
      setView('list');
    } catch (e) {
      setSaveError('Échec de la suppression complète : ' + (e && e.message ? e.message : String(e)));
    } finally { setSyncing(false); }
  };

  // Certains comptes Airtable bloquent les requêtes PATCH depuis un navigateur (bug CORS connu côté Airtable).
  // En cas d'échec, on se rabat sur : suppression puis recréation de l'enregistrement.
  const updateBookInAirtable = async (id, fields) => {
    try {
      await airtableFetch('', { method: 'PATCH', body: JSON.stringify({ records: [{ id, fields }], typecast: true }) });
      return id;
    } catch (e) {
      await airtableFetch(`?records[]=${encodeURIComponent(id)}`, { method: 'DELETE' });
      const created = await airtableFetch('', { method: 'POST', body: JSON.stringify({ records: [{ fields }], typecast: true }) });
      return created.records[0].id;
    }
  };

  const bookYear = (b) => { const d = b.endDate || b.startDate; return d ? d.slice(0, 4) : null; };

  const filteredBooks = useMemo(() => {
    const q = normalize(searchQuery);
    return books.filter((b) => {
      if (q && !normalize(b.title).includes(q) && !normalize(b.author).includes(q)) return false;
      if (statusFilter !== 'tous' && b.status !== statusFilter) return false;
      if (categoryFilter.length > 0) {
        const has = (b.categories || []).some((c) => categoryFilter.includes(c));
        if (!has) return false;
      }
      if (ratingFilter > 0 && (b.rating || 0) < ratingFilter) return false;
      if (yearFilter.length > 0 && !yearFilter.includes(bookYear(b))) return false;
      return true;
    }).sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  }, [books, searchQuery, statusFilter, categoryFilter, ratingFilter, yearFilter]);

  const luCount = useMemo(() => books.filter((b) => b.status === 'lu').length, [books]);
  const activeFilterCount = (statusFilter !== 'tous' ? 1 : 0) + categoryFilter.length + (ratingFilter > 0 ? 1 : 0) + yearFilter.length;
  const allYears = useMemo(() => {
    const s = new Set();
    books.forEach((b) => { const y = bookYear(b); if (y) s.add(y); });
    return Array.from(s).sort().reverse();
  }, [books]);

  const [dashboardYear, setDashboardYear] = useState(null);
  const [dashboardCategory, setDashboardCategory] = useState(null);
  const [dashboardStatus, setDashboardStatus] = useState(null);

  const dashboardFilteredBooks = useMemo(() => {
    return books.filter((b) => {
      if (dashboardYear && bookYear(b) !== dashboardYear) return false;
      if (dashboardCategory && !(b.categories || []).includes(dashboardCategory)) return false;
      if (dashboardStatus && b.status !== dashboardStatus) return false;
      return true;
    });
  }, [books, dashboardYear, dashboardCategory, dashboardStatus]);

  const dashboardActiveCount = (dashboardYear ? 1 : 0) + (dashboardCategory ? 1 : 0) + (dashboardStatus ? 1 : 0);
  const clearDashboardFilters = () => { setDashboardYear(null); setDashboardCategory(null); setDashboardStatus(null); };
  const toggleDashboardYear = (y) => setDashboardYear((cur) => (cur === y ? null : y));
  const toggleDashboardCategory = (c) => setDashboardCategory((cur) => (cur === c ? null : c));
  const toggleDashboardStatus = (s) => setDashboardStatus((cur) => (cur === s ? null : s));

  // Ordre stable des axes (années / catégories), calculé sur l'ensemble complet des livres
  // pour que les graphiques ne se réordonnent pas visuellement quand on clique un filtre.
  const yearAxis = useMemo(() => {
    const s = new Set();
    books.forEach((b) => { if (b.status === 'lu') { const y = bookYear(b); if (y) s.add(y); } });
    return Array.from(s).sort();
  }, [books]);
  const categoryAxis = useMemo(() => {
    const counts = {};
    books.forEach((b) => (b.categories || []).forEach((c) => { counts[c] = (counts[c] || 0) + 1; }));
    return Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  }, [books]);

  const stats = useMemo(() => {
    const source = dashboardFilteredBooks;
    const luBooks = source.filter((b) => b.status === 'lu');
    const totalPages = luBooks.reduce((sum, b) => sum + (parseInt(b.pageCount, 10) || 0), 0);
    const ratedBooks = source.filter((b) => b.rating > 0);
    const avgRating = ratedBooks.length ? ratedBooks.reduce((s, b) => s + b.rating, 0) / ratedBooks.length : null;

    const byYearData = yearAxis.map((y) => ({ label: y, value: source.filter((b) => b.status === 'lu' && bookYear(b) === y).length }));
    const byCategoryData = categoryAxis.map((c) => ({ label: c, value: source.filter((b) => (b.categories || []).includes(c)).length }));
    const byStatusData = STATUS_OPTIONS.map((s) => ({ label: s.label, id: s.id, value: source.filter((b) => b.status === s.id).length, color: s.color }));

    const topRated = source.filter((b) => b.rating > 0).sort((a, b) => b.rating - a.rating).slice(0, 5);
    const avgPagesPerBook = luBooks.length ? Math.round(totalPages / luBooks.length) : null;

    return { totalBooks: source.length, totalLu: luBooks.length, totalPages, avgRating, avgPagesPerBook, byYearData, byCategoryData, byStatusData, topRated };
  }, [dashboardFilteredBooks, yearAxis, categoryAxis]);

  // ---------- Book CRUD (Airtable) ----------
  const openNewBook = () => {
    setForm(emptyBook()); setShowImport(false); setImportedNote(false);
    setImportResults([]); setImportQuery(''); setView('form');
  };
  const openEditBook = (book) => {
    setForm({ ...book, categories: [...(book.categories || [])] });
    setShowImport(false); setImportedNote(false);
    setImportMode(book.isbn ? 'isbn' : 'titre');
    setImportQuery(book.isbn || book.title || '');
    setImportResults([]); setImportError('');
    setView('form');
  };
  const saveBook = async () => {
    if (!form.title.trim() || !airtableToken) return;
    setSyncing(true); setSaveError('');
    try {
      const fields = bookToFields(form);
      if (form.id) {
        await updateBookInAirtable(form.id, fields);
      } else {
        await airtableFetch('', { method: 'POST', body: JSON.stringify({ records: [{ fields }], typecast: true }) });
      }
      await refreshBooks();
      setView('list');
    } catch (e) {
      setSaveError('Échec de la sauvegarde : ' + (e && e.message ? e.message : String(e)));
    } finally { setSyncing(false); }
  };
  const deleteBook = async (id) => {
    setSyncing(true); setSaveError('');
    try {
      await airtableFetch(`?records[]=${encodeURIComponent(id)}`, { method: 'DELETE' });
      await refreshBooks();
      setView('list');
    } catch (e) {
      setSaveError('Échec de la suppression : ' + (e && e.message ? e.message : String(e)));
    } finally { setSyncing(false); }
  };
  const toggleFormCategory = (cat) => {
    setForm((f) => {
      const has = f.categories.includes(cat);
      return { ...f, categories: has ? f.categories.filter((c) => c !== cat) : [...f.categories, cat] };
    });
  };
  const addNewCategory = () => {
    const name = newCategoryInput.trim();
    if (!name) return;
    const match = categories.find((c) => normalize(c) === normalize(name));
    const finalName = match || name;
    if (!match) setCategories((cur) => [...cur, name]);
    if (!form.categories.includes(finalName)) setForm((f) => ({ ...f, categories: [...f.categories, finalName] }));
    setNewCategoryInput('');
  };
  const toggleFilterCategory = (cat) => {
    setCategoryFilter((cur) => (cur.includes(cat) ? cur.filter((c) => c !== cat) : [...cur, cat]));
  };

  // ---------- Export CSV (copie locale de secours, en plus d'Airtable) ----------
  const CSV_HEADERS = ['Titre', 'Auteur', 'Pages', 'ISBN', 'Statut', 'Note', 'Categories', 'Couverture', 'DebutLecture', 'FinLecture', 'PagesLues', 'Commentaire'];
  const csvEscape = (field) => {
    const str = field === null || field === undefined ? '' : String(field);
    if (/[;"\n\r]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
    return str;
  };
  const exportData = () => {
    const rows = [CSV_HEADERS.map(csvEscape).join(';')];
    books.forEach((b) => {
      const st = statusInfo(b.status);
      rows.push([
        csvEscape(b.title), csvEscape(b.author), csvEscape(b.pageCount), csvEscape(b.isbn),
        csvEscape(st.label), csvEscape(b.rating || ''), csvEscape((b.categories || []).join(', ')),
        csvEscape(b.cover || ''), csvEscape(b.startDate || ''), csvEscape(b.endDate || ''), csvEscape(b.pagesRead || ''),
        csvEscape(b.comment || ''),
      ].join(';'));
    });
    const csv = '\uFEFF' + rows.join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `bibliotheque-sauvegarde-${date}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const parseCSV = (text) => {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = []; let row = []; let field = ''; let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
        else field += c;
      } else {
        if (c === '"') inQuotes = true;
        else if (c === ';') { row.push(field); field = ''; }
        else if (c === '\r') { /* ignoré, la fin de ligne est gérée par \n */ }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else field += c;
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter((r) => r.some((c) => c !== ''));
  };

  const fileInputRef = useRef(null);
  const triggerImport = () => { if (fileInputRef.current) fileInputRef.current.click(); };
  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const rows = parseCSV(String(reader.result));
        if (rows.length < 1) throw new Error('Fichier vide.');
        const header = rows[0].map((h) => h.trim());
        const idx = (name) => header.indexOf(name);
        const iTitre = idx('Titre'), iAuteur = idx('Auteur'), iPages = idx('Pages'), iIsbn = idx('ISBN'),
          iStatut = idx('Statut'), iNote = idx('Note'), iCategories = idx('Categories'),
          iCouverture = idx('Couverture'), iDebut = idx('DebutLecture'), iFin = idx('FinLecture'), iPagesLues = idx('PagesLues'),
          iCommentaire = idx('Commentaire');
        if (iTitre === -1) throw new Error('Colonne "Titre" introuvable — ce fichier vient-il bien d\'un export de cette app ?');
        const newBooks = rows.slice(1).map((r) => {
          const statutLabel = iStatut !== -1 ? (r[iStatut] || '') : '';
          const statusMatch = STATUS_OPTIONS.find((s) => normalize(s.label) === normalize(statutLabel) || s.id === statutLabel);
          const catRaw = iCategories !== -1 ? (r[iCategories] || '') : '';
          return {
            title: r[iTitre] || '',
            author: iAuteur !== -1 ? (r[iAuteur] || '') : '',
            pageCount: iPages !== -1 ? (r[iPages] || '') : '',
            isbn: iIsbn !== -1 ? (r[iIsbn] || '') : '',
            status: statusMatch ? statusMatch.id : 'a_lire',
            rating: iNote !== -1 && r[iNote] ? (parseFloat(r[iNote]) || 0) : 0,
            categories: catRaw ? catRaw.split(',').map((c) => c.trim()).filter(Boolean) : [],
            cover: iCouverture !== -1 && r[iCouverture] ? r[iCouverture] : null,
            startDate: iDebut !== -1 ? (r[iDebut] || '') : '',
            endDate: iFin !== -1 ? (r[iFin] || '') : '',
            pagesRead: iPagesLues !== -1 ? (r[iPagesLues] || '') : '',
            comment: iCommentaire !== -1 ? (r[iCommentaire] || '') : '',
          };
        }).filter((b) => b.title);
        if (newBooks.length === 0) throw new Error('Aucun livre valide (avec un titre) trouvé dans ce fichier.');
        const ok = window.confirm(`Ajouter ${newBooks.length} livre${newBooks.length !== 1 ? 's' : ''} depuis ce fichier à ta bibliothèque Airtable (${books.length} actuellement) ?\n\nCeci ajoute des enregistrements, ça ne remplace rien.`);
        if (!ok) return;
        setSyncing(true); setSaveError('');
        for (let i = 0; i < newBooks.length; i += 10) {
          const chunk = newBooks.slice(i, i + 10).map((b) => ({ fields: bookToFields(b) }));
          await airtableFetch('', { method: 'POST', body: JSON.stringify({ records: chunk, typecast: true }) });
        }
        await refreshBooks();
      } catch (err) {
        setSaveError('Échec de l\'import : ' + (err && err.message ? err.message : String(err)));
      } finally {
        setSyncing(false);
        e.target.value = '';
      }
    };
    reader.readAsText(file, 'UTF-8');
  };

  // ---------- Google Books import ----------
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const fetchGoogleBooks = async (url) => {
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
      if (attempt > 0) await sleep(800 * attempt);
      const res = await fetch(url);
      if (res.ok) return res.json();
      lastErr = new Error('HTTP ' + res.status + (res.status === 429 ? ' (quota dépassé — ajoute une clé API dans Réglages)' : res.status === 503 ? ' (service Google temporairement indisponible)' : ''));
      if (res.status !== 503) throw lastErr; // on ne retente qu'en cas de 503 (indisponibilité temporaire)
    }
    throw lastErr;
  };

  const runImportSearch = async (overrideQuery, overrideMode) => {
    const raw = (overrideQuery !== undefined ? overrideQuery : importQuery).trim();
    const mode = overrideMode || importMode;
    if (!raw) return;
    setImportLoading(true); setImportError(''); setImportResults([]);
    try {
      let q = raw;
      if (mode === 'isbn') q = `isbn:${raw.replace(/[\s-]/g, '')}`;
      else if (mode === 'titre') q = `intitle:${raw}`;
      else if (mode === 'auteur') q = `inauthor:${raw}`;
      const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20` + (apiKey ? `&key=${encodeURIComponent(apiKey)}` : '');
      const data = await fetchGoogleBooks(url);
      const items = (data.items || []).map((item) => {
        const info = item.volumeInfo || {};
        const ids = info.industryIdentifiers || [];
        const isbn13 = (ids.find((x) => x.type === 'ISBN_13') || {}).identifier;
        const isbn10 = (ids.find((x) => x.type === 'ISBN_10') || {}).identifier;
        let cover = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || null;
        if (cover) cover = cover.replace('http://', 'https://');
        return { title: info.title || 'Sans titre', author: (info.authors || []).join(', '), pageCount: info.pageCount || '', isbn: isbn13 || isbn10 || '', cover };
      });
      setImportResults(items);
      if (items.length === 0) setImportError('Aucun résultat. Essaie un autre mot-clé ou un autre mode de recherche.');
    } catch (e) {
      setImportError('Échec de la recherche : ' + (e && e.message ? e.message : String(e)));
    } finally { setImportLoading(false); }
  };

  const applyImportResult = (item) => {
    setForm((f) => ({ ...f, title: item.title, author: item.author, pageCount: item.pageCount, isbn: item.isbn, cover: item.cover }));
    setShowImport(false); setImportedNote(true); setImportResults([]); setImportQuery('');
  };

  const lookupIsbnSilently = async (isbn) => {
    try {
      const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent('isbn:' + isbn)}&maxResults=1` + (apiKey ? `&key=${encodeURIComponent(apiKey)}` : '');
      const data = await fetchGoogleBooks(url);
      const item = (data.items || [])[0];
      if (!item) return;
      const info = item.volumeInfo || {};
      let cover = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || null;
      if (cover) cover = cover.replace('http://', 'https://');
      setForm((f) => ({
        ...f,
        title: f.title || info.title || f.title,
        author: f.author || (info.authors || []).join(', ') || f.author,
        pageCount: f.pageCount || info.pageCount || f.pageCount,
        cover: f.cover || cover,
      }));
      setImportedNote(true);
    } catch (e) { /* l'ISBN scanné reste rempli même si la recherche complémentaire échoue */ }
  };

  // ---------- Camera ISBN scanner ----------
  const openScanner = (target) => { setScannerTarget(target || 'manual'); setScannerError(''); setScannerStatus('Initialisation de la caméra...'); setShowScanner(true); };
  const closeScanner = () => {
    if (codeReaderRef.current) { try { codeReaderRef.current.reset(); } catch (e) {} }
    setShowScanner(false);
  };
  const handleScannedIsbn = (isbn) => {
    closeScanner();
    if (scannerTarget === 'import') {
      setImportMode('isbn');
      setImportQuery(isbn);
      runImportSearch(isbn, 'isbn');
    } else {
      setForm((f) => ({ ...f, isbn }));
      lookupIsbnSilently(isbn);
    }
  };

  useEffect(() => {
    if (!showScanner) return;
    if (!window.isSecureContext) {
      setScannerError("Le scan par caméra ne fonctionne que si la page est servie en HTTPS (ou localhost). L'ouvrir directement depuis le fichier ne suffit pas — héberge-le d'abord.");
      return;
    }
    if (!navigator.mediaDevices || !window.ZXing) {
      setScannerError("Le scan par caméra n'est pas disponible dans ce navigateur.");
      return;
    }
    const codeReader = new window.ZXing.BrowserMultiFormatReader();
    codeReaderRef.current = codeReader;
    let cancelled = false;
    setScannerStatus('Vise le code-barres au dos du livre');

    codeReader.decodeFromConstraints(
      { audio: false, video: { facingMode: { ideal: 'environment' } } },
      'isbn-scanner-video',
      (result) => {
        if (cancelled || !result || !result.text) return;
        const digits = result.text.replace(/[^0-9Xx]/g, '');
        if (digits.length >= 8) handleScannedIsbn(digits);
      }
    ).catch((err) => {
      if (cancelled) return;
      if (err && err.name === 'NotAllowedError') setScannerError("Accès à la caméra refusé. Autorise-le dans les réglages du navigateur pour ce site.");
      else setScannerError('Impossible d\'accéder à la caméra : ' + (err && err.message ? err.message : String(err)));
    });

    return () => { cancelled = true; try { codeReader.reset(); } catch (e) {} };
  }, [showScanner]);

  // ---------- Render ----------
  if (loading) {
    return <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: COLORS.paper }}><Icon.Loader size={28} color={COLORS.oxblood} /></div>;
  }

  if (!airtableToken) {
    return (
      <div className="min-h-screen flex items-center justify-center px-4" style={{ backgroundColor: COLORS.paper }}>
        <div className="max-w-sm w-full">
          <div className="text-xs uppercase tracking-widest mb-1" style={{ color: COLORS.gold, letterSpacing: '0.15em' }}>Configuration requise</div>
          <h1 className="font-serif text-2xl mb-3" style={{ color: COLORS.ink }}>Connecter Airtable</h1>
          <p className="text-sm mb-3" style={{ color: COLORS.inkSoft }}>
            Colle un jeton d'accès personnel Airtable (créé sur airtable.com/create/tokens), limité à la base « Ma Bibliothèque » avec les droits data.records:read et data.records:write.
          </p>
          <input
            value={airtableTokenInput}
            onChange={(e) => setAirtableTokenInput(e.target.value)}
            placeholder="pat..."
            className="w-full px-3 py-2 rounded-lg text-sm outline-none font-mono mb-2"
            style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
          />
          <button
            onClick={saveAirtableToken}
            disabled={!airtableTokenInput.trim()}
            className="w-full py-2.5 rounded-lg text-sm font-medium"
            style={{ backgroundColor: airtableTokenInput.trim() ? COLORS.accent : COLORS.gray, color: COLORS.card }}
          >
            Connecter
          </button>
          {saveError && <div className="text-sm mt-3" style={{ color: COLORS.ink }}>{saveError}</div>}
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: COLORS.paper }}>
      <div className="max-w-md mx-auto px-4 pb-24">
        {saveError && (
          <div className="flex items-center gap-2 text-sm px-3 py-2 mt-3 rounded" style={{ backgroundColor: COLORS.card, color: COLORS.ink }}>
            <Icon.Alert size={16} /> {saveError}
          </div>
        )}

        {(view === 'list' || view === 'stats') && (
          <React.Fragment>
            <div className="pt-6 pb-3" style={{ borderBottom: `1px dashed ${COLORS.line}` }}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-xs font-sans uppercase tracking-widest" style={{ color: COLORS.gold, letterSpacing: '0.15em' }}>Catalogue personnel · Airtable</div>
                  <h1 className="font-serif text-3xl mt-0.5" style={{ color: COLORS.ink }}>Bibliothèque</h1>
                  <div className="text-sm mt-1 flex items-center gap-1.5" style={{ color: COLORS.inkSoft }}>
                    {books.length} livre{books.length !== 1 ? 's' : ''} · {luCount} lu{luCount !== 1 ? 's' : ''}
                    {syncing && <Icon.Loader size={12} color={COLORS.accent} />}
                  </div>
                  <div className="flex gap-3 mt-1.5 flex-wrap">

                  </div>
                )}
                {!form.pageCount && <div className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>Renseigne le nombre de pages total ci-dessus pour voir le pourcentage.</div>}
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Note</label>
                <div className="mt-1.5"><StarRating value={form.rating || 0} onChange={(v) => setForm((f) => ({ ...f, rating: v }))} /></div>
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Catégories</label>
                <div className="flex flex-wrap gap-2 mt-1.5">
                  {categories.map((c) => <Pill key={c} active={form.categories.includes(c)} color={COLORS.forest} onClick={() => toggleFormCategory(c)}>{c}</Pill>)}
                </div>
                <div className="flex gap-2 mt-2">
                  <input value={newCategoryInput} onChange={(e) => setNewCategoryInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addNewCategory()} placeholder="Nouvelle catégorie" className="flex-1 px-3 py-2 rounded-lg text-sm outline-none" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
                  <button onClick={addNewCategory} className="px-3 py-2 rounded-lg text-sm" style={{ backgroundColor: COLORS.paperDark, color: COLORS.ink }}>Ajouter</button>
                </div>
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Commentaire</label>
                <textarea
                  value={form.comment || ''}
                  onChange={(e) => setForm((f) => ({ ...f, comment: e.target.value }))}
                  placeholder="Tes impressions, citations à retenir, pour qui le recommander..."
                  rows={4}
                  className="w-full px-3 py-2 rounded-lg text-sm outline-none mt-1.5"
                  style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink, resize: 'vertical', fontFamily: 'inherit' }}
                />
              </div>
            </div>
          </div>
        )}
      </div>

      {view === 'form' && (
        <div className="fixed bottom-0 left-0 right-0 px-4 py-3" style={{ backgroundColor: COLORS.paper, borderTop: `1px solid ${COLORS.line}`, paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom))' }}>
          <div className="max-w-md mx-auto flex gap-2">
            <button onClick={() => setView('list')} className="flex-1 py-2.5 rounded-lg text-sm" style={{ backgroundColor: COLORS.paperDark, color: COLORS.ink }}>Annuler</button>
            <button onClick={saveBook} disabled={!form.title.trim() || syncing} className="flex-1 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-1.5" style={{ backgroundColor: form.title.trim() && !syncing ? COLORS.oxblood : COLORS.gray, color: COLORS.card }}>
              {syncing && <Icon.Loader size={14} color={COLORS.card} />} Enregistrer
            </button>
          </div>
        </div>
      )}

      {showScanner && (
        <div className="fixed inset-0 z-50 flex flex-col" style={{ backgroundColor: 'rgba(10,10,8,0.94)' }}>
          <div className="flex items-center justify-between px-4" style={{ paddingTop: 'calc(0.75rem + env(safe-area-inset-top))', paddingBottom: '0.75rem' }}>
            <span className="text-sm text-white">{scannerStatus || 'Scanner un code-barres'}</span>
            <button onClick={closeScanner} className="text-white p-2"><Icon.X size={20} color="#fff" /></button>
          </div>
          <div className="flex-1 flex items-center justify-center px-4">
            {scannerError ? (
              <div className="text-center text-sm max-w-xs" style={{ color: '#fff' }}>{scannerError}</div>
            ) : (
              <video id="isbn-scanner-video" autoPlay muted playsInline className="w-full max-w-sm rounded-lg" style={{ maxHeight: '60vh', backgroundColor: '#111' }} />
            )}
          </div>
          <div className="text-center text-xs pb-8 px-6" style={{ color: 'rgba(255,255,255,0.6)', paddingBottom: 'calc(2rem + env(safe-area-inset-bottom))' }}>
            Cadre le code-barres ISBN au dos du livre.
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  (function () {
    var el = document.getElementById('fallback-error');
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx'
      }).code;
      var s = document.createElement('script');
      s.text = output;
      document.body.appendChild(s);
    } catch (err) {
      if (el) {
        el.style.display = 'block';
        el.textContent += 'Erreur de compilation Babel : ' + (err && err.message ? err.message : err) + '\n\n';
      }
    }
  })();
</script>
</body>
</html>
