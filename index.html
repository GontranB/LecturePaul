  .mt-0\.5 { margin-top: .125rem; } .mt-1 { margin-top: .25rem; } .mt-1\.5 { margin-top: .375rem; }

  .rounded { border-radius: .25rem; } .rounded-lg { border-radius: .5rem; } .rounded-full { border-radius: 9999px; }

  .text-center { text-align: center; } .text-left { text-align: left; }

  .font-medium { font-weight: 500; }
  .font-serif { font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif; }
  .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
  .font-sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .tracking-wide { letter-spacing: .025em; } .tracking-widest { letter-spacing: .1em; }
  .leading-snug { line-height: 1.375; }
  .uppercase { text-transform: uppercase; }
  .underline { text-decoration: underline; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .fixed { position: fixed; }
  .inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
  .bottom-0 { bottom: 0; } .left-0 { left: 0; } .right-0 { right: 0; }
  .z-50 { z-index: 50; }

  .overflow-hidden { overflow: hidden; }
  .overflow-y-auto { overflow-y: auto; }
  .object-cover { object-fit: cover; }
  .outline-none { outline: none; }
  .bg-transparent { background-color: transparent; }
  .transition-colors { transition: background-color .15s, color .15s, border-color .15s; }
  .cursor-pointer { cursor: pointer; }
  .animate-spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  html, body { background: #F0E9D8; overscroll-behavior-y: contain; }
  * { -webkit-tap-highlight-color: transparent; }
</style>
<script>
  window.addEventListener('error', function (e) {
    var el = document.getElementById('fallback-error');
    if (!el) return;
    var msg;
    if (e.target && e.target !== window && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
      msg = 'Échec de chargement d\'une ressource : ' + (e.target.src || e.target.href);
    } else {
      msg = (e.message || 'Erreur inconnue') + '  [' + (e.filename || '?') + ':' + (e.lineno || '?') + ']';
    }
    el.style.display = 'block';
    el.textContent += msg + '\n\n';
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var el = document.getElementById('fallback-error');
    if (!el) return;
    el.style.display = 'block';
    el.textContent += 'Promesse rejetée : ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '\n\n';
  });
</script>

<div id="fallback-error" style="display:none; margin:16px; padding:12px; font-family: ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; color:#7A2E2E; background:#F7F2E5; border:1px solid #D9CFB8; border-radius:8px; font-size:13px;"></div>
<div id="root"><p style="padding:20px; font-family: sans-serif; color:#6B6455;">Chargement de l'application…</p></div>
<script type="text/plain" id="app-source">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Design tokens ----------
const COLORS = {
  paper: '#F0E9D8', paperDark: '#E4D9C0', card: '#F7F2E5',
  ink: '#232320', inkSoft: '#6B6455', oxblood: '#7A2E2E',
  forest: '#2F4030', gold: '#B8862B', slate: '#3B4A5A',
  gray: '#8B8378', line: '#D9CFB8',
};

const STATUS_OPTIONS = [
  { id: 'a_acheter', label: 'À acheter', color: COLORS.gold },
  { id: 'a_lire', label: 'À lire', color: COLORS.slate },
  { id: 'en_cours', label: 'En cours de lecture', color: COLORS.oxblood },
  { id: 'lu', label: 'Lu', color: COLORS.forest },
  { id: 'abandonne', label: 'Abandonné', color: COLORS.gray },
];

const DEFAULT_CATEGORIES = ['Policier', 'Étranger', 'Roman graphique'];
const STORAGE_KEY = 'biblio-data';

function statusInfo(id) { return STATUS_OPTIONS.find((s) => s.id === id) || STATUS_OPTIONS[1]; }
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function normalize(s) { return (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function makeId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function emptyBook() {
  return { id: null, title: '', author: '', pageCount: '', isbn: '', status: 'a_lire', rating: 0, categories: [], cover: null };
}

// ---------- Icons (self-contained SVGs, no external icon library) ----------
const STAR_POINTS = "12,2 14.35,8.76 21.51,8.91 15.80,13.24 17.88,20.09 12,16 6.12,20.09 8.20,13.24 2.49,8.91 9.65,8.76";
function StarShape({ size = 20, color = '#000', fill = false }) {
  return (
    <svg viewBox="0 0 24 24" width={size} height={size} style={{ display: 'block' }}>
      <polygon points={STAR_POINTS} fill={fill ? color : 'none'} stroke={color} strokeWidth="1.6" strokeLinejoin="round" />
    </svg>
  );
}
const Icon = {
  Search: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><circle cx="10" cy="10" r="6" /><line x1="20" y1="20" x2="14.5" y2="14.5" /></svg>
  ),
  Plus: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
  ),
  X: ({ size = 14, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round"><line x1="5" y1="5" x2="19" y2="19" /><line x1="19" y1="5" x2="5" y2="19" /></svg>
  ),
  Filter: ({ size = 14, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="4,4 20,4 14,13 14,19 10,19 10,13" /></svg>
  ),
  ChevronLeft: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15,4 7,12 15,20" /></svg>
  ),
  ChevronDown: ({ size = 16, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4,8 12,16 20,8" /></svg>
  ),
  Trash: ({ size = 15, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" y1="7" x2="20" y2="7" /><path d="M6 7 L7 21 H17 L18 7" /><path d="M9 7 V4 H15 V7" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
  ),
  BookOpen: ({ size = 24, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 5 C6 3 10 3 12 5 C14 3 18 3 22 5 V19 C18 17 14 17 12 19 C10 17 6 17 2 19 Z" /><line x1="12" y1="5" x2="12" y2="19" /></svg>
  ),
  Check: ({ size = 15, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="4,13 9,18 20,6" /></svg>
  ),
  Alert: ({ size = 16, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9" /><line x1="12" y1="8" x2="12" y2="13" /><circle cx="12" cy="16.3" r="0.6" fill={color} stroke="none" /></svg>
  ),
  Camera: ({ size = 16, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 8 H7 L9 5 H15 L17 8 H20 A1 1 0 0 1 21 9 V18 A1 1 0 0 1 20 19 H4 A1 1 0 0 1 3 18 V9 A1 1 0 0 1 4 8 Z" /><circle cx="12" cy="13.5" r="3.5" /></svg>
  ),
  Loader: ({ size = 18, color = 'currentColor' }) => (
    <svg viewBox="0 0 24 24" width={size} height={size} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" className="animate-spin"><path d="M12 3 A9 9 0 0 1 21 12" /></svg>
  ),
};

// ---------- Star rating (1-5, half-star steps) ----------
function StarRating({ value, onChange, readOnly, size = 22 }) {
  const handleClick = (e, starIndex) => {
    if (readOnly) return;
    const rect = e.currentTarget.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const isHalf = clickX < rect.width / 2;
    const newValue = isHalf ? starIndex - 0.5 : starIndex;
    onChange(value === newValue ? 0 : newValue);
  };
  return (
    <div className="flex items-center gap-2">
      <div className="flex gap-0.5">
        {[1, 2, 3, 4, 5].map((i) => {
          const fillPct = Math.max(0, Math.min(1, value - (i - 1))) * 100;
          return (
            <div key={i} onClick={(e) => handleClick(e, i)} className={readOnly ? '' : 'cursor-pointer'} style={{ position: 'relative', width: size, height: size, flexShrink: 0 }}>
              <StarShape size={size} color={COLORS.line} fill={false} />
              <div style={{ position: 'absolute', top: 0, left: 0, width: `${fillPct}%`, overflow: 'hidden' }}>
                <StarShape size={size} color={COLORS.gold} fill={true} />
              </div>
            </div>
          );
        })}
      </div>
      {!readOnly && value > 0 && (
        <button onClick={() => onChange(0)} className="text-xs underline" style={{ color: COLORS.inkSoft }}>effacer</button>
      )}
      {!readOnly && (
        <span className="text-sm tabular-nums" style={{ color: COLORS.inkSoft }}>{value > 0 ? value.toFixed(1) : '—'}</span>
      )}
    </div>
  );
}

// ---------- Cover thumbnail with fallback ----------
function Cover({ src, size = 56 }) {
  const [failed, setFailed] = useState(false);
  return (
    <div className="flex items-center justify-center rounded overflow-hidden flex-shrink-0" style={{ width: size, height: size * 1.4, backgroundColor: COLORS.paperDark }}>
      {src && !failed ? (
        <img src={src} alt="" onError={() => setFailed(true)} className="w-full h-full object-cover" />
      ) : (
        <Icon.BookOpen size={size * 0.4} color={COLORS.gray} />
      )}
    </div>
  );
}

// ---------- Pill button ----------
function Pill({ active, color, onClick, children }) {
  const c = color || COLORS.ink;
  return (
    <button onClick={onClick} className="px-3 py-1.5 rounded-full text-sm border whitespace-nowrap transition-colors"
      style={active ? { backgroundColor: c, borderColor: c, color: COLORS.card } : { backgroundColor: hexToRgba(c, 0.08), borderColor: hexToRgba(c, 0.35), color: c }}>
      {children}
    </button>
  );
}

function App() {
  const [books, setBooks] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);

  const [view, setView] = useState('list');
  const [form, setForm] = useState(emptyBook());
  const [newCategoryInput, setNewCategoryInput] = useState('');

  const [searchQuery, setSearchQuery] = useState('');
  const [showFilters, setShowFilters] = useState(false);
  const [statusFilter, setStatusFilter] = useState('tous');
  const [categoryFilter, setCategoryFilter] = useState([]);

  const [showImport, setShowImport] = useState(false);
  const [importMode, setImportMode] = useState('titre');
  const [importQuery, setImportQuery] = useState('');
  const [importResults, setImportResults] = useState([]);
  const [importLoading, setImportLoading] = useState(false);
  const [importError, setImportError] = useState('');
  const [importedNote, setImportedNote] = useState(false);

  const [showScanner, setShowScanner] = useState(false);
  const [scannerStatus, setScannerStatus] = useState('');
  const [scannerError, setScannerError] = useState('');
  const codeReaderRef = useRef(null);

  // ---------- Load / persist (localStorage — this file runs outside the Claude sandbox) ----------
  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        setBooks(Array.isArray(parsed.books) ? parsed.books : []);
        setCategories(Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES);
      }
    } catch (e) { /* première utilisation, ou stockage illisible : on part des valeurs par défaut */ }
    setLoading(false);
  }, []);

  const persist = (newBooks, newCategories) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ books: newBooks, categories: newCategories }));
      setSaveError(false);
    } catch (e) { setSaveError(true); }
  };

  const filteredBooks = useMemo(() => {
    const q = normalize(searchQuery);
    return books.filter((b) => {
      if (q && !normalize(b.title).includes(q) && !normalize(b.author).includes(q)) return false;
      if (statusFilter !== 'tous' && b.status !== statusFilter) return false;
      if (categoryFilter.length > 0) {
        const has = (b.categories || []).some((c) => categoryFilter.includes(c));
        if (!has) return false;
      }
      return true;
    }).sort((a, b) => a.title.localeCompare(b.title, 'fr'));
  }, [books, searchQuery, statusFilter, categoryFilter]);

  const luCount = useMemo(() => books.filter((b) => b.status === 'lu').length, [books]);
  const activeFilterCount = (statusFilter !== 'tous' ? 1 : 0) + categoryFilter.length;

  // ---------- Book CRUD ----------
  const openNewBook = () => {
    setForm(emptyBook()); setShowImport(false); setImportedNote(false);
    setImportResults([]); setImportQuery(''); setView('form');
  };
  const openEditBook = (book) => {
    setForm({ ...book, categories: [...(book.categories || [])] });
    setShowImport(false); setImportedNote(false); setView('form');
  };
  const saveBook = () => {
    if (!form.title.trim()) return;
    let newBooks;
    if (form.id) newBooks = books.map((b) => (b.id === form.id ? { ...form } : b));
    else newBooks = [...books, { ...form, id: makeId() }];
    setBooks(newBooks); persist(newBooks, categories); setView('list');
  };
  const deleteBook = (id) => {
    const newBooks = books.filter((b) => b.id !== id);
    setBooks(newBooks); persist(newBooks, categories); setView('list');
  };
  const toggleFormCategory = (cat) => {
    setForm((f) => {
      const has = f.categories.includes(cat);
      return { ...f, categories: has ? f.categories.filter((c) => c !== cat) : [...f.categories, cat] };
    });
  };
  const addNewCategory = () => {
    const name = newCategoryInput.trim();
    if (!name) return;
    const match = categories.find((c) => normalize(c) === normalize(name));
    const finalName = match || name;
    const newCategories = match ? categories : [...categories, name];
    if (!match) setCategories(newCategories);
    if (!form.categories.includes(finalName)) setForm((f) => ({ ...f, categories: [...f.categories, finalName] }));
    setNewCategoryInput('');
    persist(books, newCategories);
  };
  const toggleFilterCategory = (cat) => {
    setCategoryFilter((cur) => (cur.includes(cat) ? cur.filter((c) => c !== cat) : [...cur, cat]));
  };

  // ---------- Google Books import ----------
  const runImportSearch = async () => {
    const raw = importQuery.trim();
    if (!raw) return;
    setImportLoading(true); setImportError(''); setImportResults([]);
    try {
      let q = raw;
      if (importMode === 'isbn') q = `isbn:${raw.replace(/[\s-]/g, '')}`;
      else if (importMode === 'titre') q = `intitle:${raw}`;
      else if (importMode === 'auteur') q = `inauthor:${raw}`;
      const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=20`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('request failed');
      const data = await res.json();
      const items = (data.items || []).map((item) => {
        const info = item.volumeInfo || {};
        const ids = info.industryIdentifiers || [];
        const isbn13 = (ids.find((x) => x.type === 'ISBN_13') || {}).identifier;
        const isbn10 = (ids.find((x) => x.type === 'ISBN_10') || {}).identifier;
        let cover = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || null;
        if (cover) cover = cover.replace('http://', 'https://');
        return { title: info.title || 'Sans titre', author: (info.authors || []).join(', '), pageCount: info.pageCount || '', isbn: isbn13 || isbn10 || '', cover };
      });
      setImportResults(items);
      if (items.length === 0) setImportError('Aucun résultat. Essaie un autre mot-clé ou un autre mode de recherche.');
    } catch (e) {
      setImportError("La recherche a échoué. Vérifie ta connexion et réessaie.");
    } finally { setImportLoading(false); }
  };

  const applyImportResult = (item) => {
    setForm((f) => ({ ...f, title: item.title, author: item.author, pageCount: item.pageCount, isbn: item.isbn, cover: item.cover }));
    setShowImport(false); setImportedNote(true); setImportResults([]); setImportQuery('');
  };

  const lookupIsbnSilently = async (isbn) => {
    try {
      const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent('isbn:' + isbn)}&maxResults=1`;
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      const item = (data.items || [])[0];
      if (!item) return;
      const info = item.volumeInfo || {};
      let cover = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || null;
      if (cover) cover = cover.replace('http://', 'https://');
      setForm((f) => ({
        ...f,
        title: f.title || info.title || f.title,
        author: f.author || (info.authors || []).join(', ') || f.author,
        pageCount: f.pageCount || info.pageCount || f.pageCount,
        cover: f.cover || cover,
      }));
      setImportedNote(true);
    } catch (e) { /* l'ISBN scanné reste rempli même si la recherche complémentaire échoue */ }
  };

  // ---------- Camera ISBN scanner ----------
  const openScanner = () => { setScannerError(''); setScannerStatus('Initialisation de la caméra...'); setShowScanner(true); };
  const closeScanner = () => {
    if (codeReaderRef.current) { try { codeReaderRef.current.reset(); } catch (e) {} }
    setShowScanner(false);
  };
  const handleScannedIsbn = (isbn) => {
    closeScanner();
    setForm((f) => ({ ...f, isbn }));
    lookupIsbnSilently(isbn);
  };

  useEffect(() => {
    if (!showScanner) return;
    if (!window.isSecureContext) {
      setScannerError("Le scan par caméra ne fonctionne que si la page est servie en HTTPS (ou localhost). L'ouvrir directement depuis le fichier ne suffit pas — héberge-le d'abord.");
      return;
    }
    if (!navigator.mediaDevices || !window.ZXing) {
      setScannerError("Le scan par caméra n'est pas disponible dans ce navigateur.");
      return;
    }
    const codeReader = new window.ZXing.BrowserMultiFormatReader();
    codeReaderRef.current = codeReader;
    let cancelled = false;

    codeReader.listVideoInputDevices().then((devices) => {
      if (cancelled) return;
      if (!devices || devices.length === 0) { setScannerError('Aucune caméra détectée.'); return; }
      const back = devices.find((d) => /back|arri[eè]re|rear|environment/i.test(d.label || ''));
      const deviceId = (back || devices[devices.length - 1]).deviceId;
      setScannerStatus('Vise le code-barres au dos du livre');
      codeReader.decodeFromVideoDevice(deviceId, 'isbn-scanner-video', (result) => {
        if (cancelled || !result || !result.text) return;
        const digits = result.text.replace(/[^0-9Xx]/g, '');
        if (digits.length >= 8) handleScannedIsbn(digits);
      });
    }).catch((err) => {
      if (cancelled) return;
      if (err && err.name === 'NotAllowedError') setScannerError("Accès à la caméra refusé. Autorise-le dans les réglages du navigateur pour ce site.");
      else setScannerError("Impossible d'accéder à la caméra.");
    });

    return () => { cancelled = true; try { codeReader.reset(); } catch (e) {} };
  }, [showScanner]);

  // ---------- Render ----------
  if (loading) {
    return <div className="min-h-screen flex items-center justify-center" style={{ backgroundColor: COLORS.paper }}><Icon.Loader size={28} color={COLORS.oxblood} /></div>;
  }

  return (
    <div className="min-h-screen" style={{ backgroundColor: COLORS.paper }}>
      <div className="max-w-md mx-auto px-4 pb-24">
        {saveError && (
          <div className="flex items-center gap-2 text-sm px-3 py-2 mt-3 rounded" style={{ backgroundColor: hexToRgba(COLORS.oxblood, 0.1), color: COLORS.oxblood }}>
            <Icon.Alert size={16} /> La sauvegarde a échoué (stockage plein ou bloqué par le navigateur).
          </div>
        )}

        {view === 'list' && (
          <React.Fragment>
            <div className="pt-6 pb-3" style={{ borderBottom: `1px dashed ${COLORS.line}` }}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-xs font-sans uppercase tracking-widest" style={{ color: COLORS.gold, letterSpacing: '0.15em' }}>Catalogue personnel</div>
                  <h1 className="font-serif text-3xl mt-0.5" style={{ color: COLORS.ink }}>Bibliothèque</h1>
                  <div className="text-sm mt-1" style={{ color: COLORS.inkSoft }}>{books.length} livre{books.length !== 1 ? 's' : ''} · {luCount} lu{luCount !== 1 ? 's' : ''}</div>
                </div>
                <button onClick={openNewBook} className="rounded-full p-3 flex-shrink-0" style={{ backgroundColor: COLORS.oxblood, color: COLORS.card }} aria-label="Ajouter un livre"><Icon.Plus size={20} /></button>
              </div>
            </div>

            <div className="flex gap-2 mt-4">
              <div className="flex-1 flex items-center gap-2 px-3 py-2 rounded-lg" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}` }}>
                <Icon.Search size={16} color={COLORS.inkSoft} />
                <input value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Titre ou auteur..." className="flex-1 bg-transparent outline-none text-sm" style={{ color: COLORS.ink }} />
                {searchQuery && <button onClick={() => setSearchQuery('')}><Icon.X size={14} color={COLORS.inkSoft} /></button>}
              </div>
              <button onClick={() => setShowFilters((s) => !s)} className="flex items-center gap-1 px-3 py-2 rounded-lg text-sm flex-shrink-0"
                style={{ backgroundColor: activeFilterCount ? COLORS.slate : COLORS.card, color: activeFilterCount ? COLORS.card : COLORS.ink, border: `1px solid ${COLORS.line}` }}>
                <Icon.Filter size={14} /> Filtres{activeFilterCount ? ` (${activeFilterCount})` : ''}
              </button>
            </div>

            {showFilters && (
              <div className="mt-3 p-3 rounded-lg" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}` }}>
                <div className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.inkSoft }}>Statut</div>
                <div className="flex flex-wrap gap-2 mb-3">
                  <Pill active={statusFilter === 'tous'} color={COLORS.ink} onClick={() => setStatusFilter('tous')}>Tous</Pill>
                  {STATUS_OPTIONS.map((s) => <Pill key={s.id} active={statusFilter === s.id} color={s.color} onClick={() => setStatusFilter(s.id)}>{s.label}</Pill>)}
                </div>
                <div className="text-xs uppercase tracking-wide mb-2" style={{ color: COLORS.inkSoft }}>Catégories</div>
                <div className="flex flex-wrap gap-2">
                  {categories.map((c) => <Pill key={c} active={categoryFilter.includes(c)} color={COLORS.forest} onClick={() => toggleFilterCategory(c)}>{c}</Pill>)}
                </div>
                {activeFilterCount > 0 && (
                  <button onClick={() => { setStatusFilter('tous'); setCategoryFilter([]); }} className="text-xs underline mt-3" style={{ color: COLORS.oxblood }}>Réinitialiser les filtres</button>
                )}
              </div>
            )}

            <div className="mt-4 flex flex-col gap-2">
              {filteredBooks.length === 0 && books.length > 0 && <div className="text-center py-12 text-sm" style={{ color: COLORS.inkSoft }}>Aucun livre ne correspond à cette recherche.</div>}
              {books.length === 0 && (
                <div className="text-center py-16">
                  <Icon.BookOpen size={36} color={COLORS.gray} />
                  <div className="font-serif text-lg mt-3" style={{ color: COLORS.ink }}>Ta bibliothèque est vide</div>
                  <div className="text-sm mt-1" style={{ color: COLORS.inkSoft }}>Ajoute ton premier livre avec le bouton +</div>
                </div>
              )}
              {filteredBooks.map((book) => {
                const st = statusInfo(book.status);
                return (
                  <button key={book.id} onClick={() => openEditBook(book)} className="flex gap-3 p-2.5 rounded-lg text-left items-stretch" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}` }}>
                    <div className="w-1.5 rounded-full flex-shrink-0" style={{ backgroundColor: st.color }} />
                    <Cover src={book.cover} size={44} />
                    <div className="flex-1 min-w-0 py-0.5">
                      <div className="font-serif text-base leading-snug truncate" style={{ color: COLORS.ink }}>{book.title}</div>
                      <div className="text-sm truncate" style={{ color: COLORS.inkSoft }}>{book.author || 'Auteur inconnu'}</div>
                      <div className="mt-1"><StarRating value={book.rating || 0} readOnly size={13} onChange={() => {}} /></div>
                      <div className="flex flex-wrap gap-1 mt-1.5">
                        <span className="text-xs px-2 py-0.5 rounded-full" style={{ backgroundColor: hexToRgba(st.color, 0.12), color: st.color }}>{st.label}</span>
                        {(book.categories || []).slice(0, 2).map((c) => <span key={c} className="text-xs px-2 py-0.5 rounded-full" style={{ backgroundColor: hexToRgba(COLORS.forest, 0.1), color: COLORS.forest }}>{c}</span>)}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
          </React.Fragment>
        )}

        {view === 'form' && (
          <div className="pt-6">
            <div className="flex items-center justify-between mb-4">
              <button onClick={() => setView('list')} className="flex items-center gap-1 text-sm" style={{ color: COLORS.inkSoft }}><Icon.ChevronLeft size={18} /> Retour</button>
              {form.id && <button onClick={() => deleteBook(form.id)} className="flex items-center gap-1 text-sm" style={{ color: COLORS.oxblood }}><Icon.Trash size={15} /> Supprimer</button>}
            </div>

            <h2 className="font-serif text-2xl mb-4" style={{ color: COLORS.ink }}>{form.id ? 'Modifier le livre' : 'Ajouter un livre'}</h2>

            {!form.id && (
              <div className="mb-5 rounded-lg overflow-hidden" style={{ border: `1px solid ${COLORS.line}` }}>
                <button onClick={() => setShowImport((s) => !s)} className="w-full flex items-center justify-between px-3 py-2.5" style={{ backgroundColor: COLORS.card }}>
                  <span className="text-sm font-medium" style={{ color: COLORS.slate }}>Importer depuis Google Books</span>
                  <Icon.ChevronDown size={16} color={COLORS.inkSoft} />
                </button>
                {showImport && (
                  <div className="p-3" style={{ backgroundColor: COLORS.paper }}>
                    <div className="flex gap-1.5 mb-2">
                      {[{ id: 'titre', label: 'Titre' }, { id: 'auteur', label: 'Auteur' }, { id: 'isbn', label: 'ISBN' }].map((m) => (
                        <Pill key={m.id} active={importMode === m.id} color={COLORS.slate} onClick={() => setImportMode(m.id)}>{m.label}</Pill>
                      ))}
                    </div>
                    <div className="flex gap-2">
                      <input value={importQuery} onChange={(e) => setImportQuery(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && runImportSearch()}
                        placeholder={importMode === 'isbn' ? '978...' : importMode === 'auteur' ? "Nom de l'auteur" : 'Titre du livre'}
                        className="flex-1 px-3 py-2 rounded-lg text-sm outline-none" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
                      {importMode === 'isbn' && (
                        <button onClick={openScanner} className="px-3 py-2 rounded-lg text-sm flex items-center gap-1" style={{ backgroundColor: COLORS.forest, color: COLORS.card }}>
                          <Icon.Camera size={15} />
                        </button>
                      )}
                      <button onClick={runImportSearch} className="px-3 py-2 rounded-lg text-sm flex items-center gap-1" style={{ backgroundColor: COLORS.slate, color: COLORS.card }}>
                        {importLoading ? <Icon.Loader size={15} /> : <Icon.Search size={15} />} Chercher
                      </button>
                    </div>
                    {importError && <div className="text-sm mt-2" style={{ color: COLORS.oxblood }}>{importError}</div>}
                    {importResults.length > 0 && (
                      <div className="mt-3 flex flex-col gap-1.5 max-h-72 overflow-y-auto">
                        {importResults.map((item, idx) => (
                          <button key={idx} onClick={() => applyImportResult(item)} className="flex gap-2.5 p-2 rounded-lg text-left" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}` }}>
                            <Cover src={item.cover} size={36} />
                            <div className="min-w-0">
                              <div className="text-sm font-medium truncate" style={{ color: COLORS.ink }}>{item.title}</div>
                              <div className="text-xs truncate" style={{ color: COLORS.inkSoft }}>{item.author || 'Auteur inconnu'}{item.pageCount ? ` · ${item.pageCount} p.` : ''}</div>
                            </div>
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {importedNote && (
              <div className="flex items-center gap-2 text-sm px-3 py-2 mb-4 rounded-lg" style={{ backgroundColor: hexToRgba(COLORS.forest, 0.1), color: COLORS.forest }}>
                <Icon.Check size={15} /> Informations importées — vérifie-les et complète le reste ci-dessous.
              </div>
            )}

            <div className="flex flex-col gap-3.5">
              <div className="flex gap-3">
                {form.cover && <Cover src={form.cover} size={64} />}
                <div className="flex-1">
                  <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Titre</label>
                  <input value={form.title} onChange={(e) => setForm((f) => ({ ...f, title: e.target.value }))} className="w-full px-3 py-2 rounded-lg text-sm outline-none mt-1" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} placeholder="Titre du livre" />
                </div>
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Auteur</label>
                <input value={form.author} onChange={(e) => setForm((f) => ({ ...f, author: e.target.value }))} className="w-full px-3 py-2 rounded-lg text-sm outline-none mt-1" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} placeholder="Nom de l'auteur" />
              </div>

              <div className="flex gap-3">
                <div className="flex-1">
                  <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Pages</label>
                  <input type="number" min="0" value={form.pageCount} onChange={(e) => setForm((f) => ({ ...f, pageCount: e.target.value }))} className="w-full px-3 py-2 rounded-lg text-sm outline-none mt-1" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} placeholder="0" />
                </div>
                <div className="flex-1">
                  <div className="flex items-center justify-between">
                    <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>ISBN</label>
                    <button onClick={openScanner} className="flex items-center gap-1 text-xs" style={{ color: COLORS.forest }}><Icon.Camera size={13} /> Scanner</button>
                  </div>
                  <input value={form.isbn} onChange={(e) => setForm((f) => ({ ...f, isbn: e.target.value }))} className="w-full px-3 py-2 rounded-lg text-sm outline-none mt-1 font-mono" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} placeholder="978..." />
                </div>
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Statut</label>
                <div className="flex flex-wrap gap-2 mt-1.5">
                  {STATUS_OPTIONS.map((s) => <Pill key={s.id} active={form.status === s.id} color={s.color} onClick={() => setForm((f) => ({ ...f, status: s.id }))}>{s.label}</Pill>)}
                </div>
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Note</label>
                <div className="mt-1.5"><StarRating value={form.rating || 0} onChange={(v) => setForm((f) => ({ ...f, rating: v }))} /></div>
              </div>

              <div>
                <label className="text-xs uppercase tracking-wide" style={{ color: COLORS.inkSoft }}>Catégories</label>
                <div className="flex flex-wrap gap-2 mt-1.5">
                  {categories.map((c) => <Pill key={c} active={form.categories.includes(c)} color={COLORS.forest} onClick={() => toggleFormCategory(c)}>{c}</Pill>)}
                </div>
                <div className="flex gap-2 mt-2">
                  <input value={newCategoryInput} onChange={(e) => setNewCategoryInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && addNewCategory()} placeholder="Nouvelle catégorie" className="flex-1 px-3 py-2 rounded-lg text-sm outline-none" style={{ backgroundColor: COLORS.card, border: `1px solid ${COLORS.line}`, color: COLORS.ink }} />
                  <button onClick={addNewCategory} className="px-3 py-2 rounded-lg text-sm" style={{ backgroundColor: COLORS.paperDark, color: COLORS.ink }}>Ajouter</button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>

      {view === 'form' && (
        <div className="fixed bottom-0 left-0 right-0 px-4 py-3" style={{ backgroundColor: COLORS.paper, borderTop: `1px solid ${COLORS.line}`, paddingBottom: 'calc(0.75rem + env(safe-area-inset-bottom))' }}>
          <div className="max-w-md mx-auto flex gap-2">
            <button onClick={() => setView('list')} className="flex-1 py-2.5 rounded-lg text-sm" style={{ backgroundColor: COLORS.paperDark, color: COLORS.ink }}>Annuler</button>
            <button onClick={saveBook} disabled={!form.title.trim()} className="flex-1 py-2.5 rounded-lg text-sm font-medium" style={{ backgroundColor: form.title.trim() ? COLORS.oxblood : COLORS.gray, color: COLORS.card }}>Enregistrer</button>
          </div>
        </div>
      )}

      {showScanner && (
        <div className="fixed inset-0 z-50 flex flex-col" style={{ backgroundColor: 'rgba(10,10,8,0.94)' }}>
          <div className="flex items-center justify-between px-4" style={{ paddingTop: 'calc(0.75rem + env(safe-area-inset-top))', paddingBottom: '0.75rem' }}>
            <span className="text-sm text-white">{scannerStatus || 'Scanner un code-barres'}</span>
            <button onClick={closeScanner} className="text-white p-2"><Icon.X size={20} color="#fff" /></button>
          </div>
          <div className="flex-1 flex items-center justify-center px-4">
            {scannerError ? (
              <div className="text-center text-sm max-w-xs" style={{ color: '#fff' }}>{scannerError}</div>
            ) : (
              <video id="isbn-scanner-video" autoPlay muted playsInline className="w-full max-w-sm rounded-lg" style={{ maxHeight: '60vh', backgroundColor: '#111' }} />
            )}
          </div>
          <div className="text-center text-xs pb-8 px-6" style={{ color: 'rgba(255,255,255,0.6)', paddingBottom: 'calc(2rem + env(safe-area-inset-bottom))' }}>
            Cadre le code-barres ISBN au dos du livre.
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script>
  (function () {
    var el = document.getElementById('fallback-error');
    try {
      var source = document.getElementById('app-source').textContent;
      var output = Babel.transform(source, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx'
      }).code;
      var s = document.createElement('script');
      s.text = output;
      document.body.appendChild(s);
    } catch (err) {
      if (el) {
        el.style.display = 'block';
        el.textContent += 'Erreur de compilation Babel : ' + (err && err.message ? err.message : err) + '\n\n';
      }
    }
  })();
</script>
</body>
</html>
